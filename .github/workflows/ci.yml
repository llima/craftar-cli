name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never on main: release runs after ci, so a cancelled run skips that commit's release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }} · shard ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
        # Windows runs the suite in two halves (vitest --shard): whole, it took 18–30 min of the 35 min limit.
        shard: ["1/1", "1/2", "2/2"]
        exclude:
          - { os: ubuntu-latest, shard: "1/2" }
          - { os: ubuntu-latest, shard: "2/2" }
          - { os: windows-latest, shard: "1/1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test -- --shard=$SHARD
        env:
          SHARD: ${{ matrix.shard }}
      - name: Oracle status
        if: always()
        shell: bash
        run: 'echo "oracle: skipped — no fixture in CI" >> "$GITHUB_STEP_SUMMARY"'
